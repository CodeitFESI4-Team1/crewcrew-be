spring:
  web:
    resources:
      add-mappings: false



  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 128MB
      max-request-size: 128MB

# jwt
jwt:
  secret:
    key: ${JWT.SECRET.KEY}
  access:
    expire: ${JWT.ACCESS.EXPIRE}
  refresh:
    expire: ${JWT.REFRESH.EXPIRE}