spring:
  web:
    resources:
      add-mappings: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret:
    key: ${jwt.secret.key}
  access:
    expire: ${jwt.access.expire}
  refresh:
    expire: ${jwt.refresh.expire}
  redis:
    host: localhost
    port: 6379