spring:
  web:
    resources:
      add-mappings: false



  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 128MB
      max-request-size: 128MB

# jwt
jwt:
  secret:
    key: ${JWT_SECRET_KEY}
  access:
    expire: ${JWT_ACCESS_EXPIRE}
  refresh:
    expire: ${JWT_REFRESH_EXPIRE}

# S3
cloud:
  aws:
    s3:
      bucket: crewcrew
      path:
        crew: crew
        gathering : gathering
        member : member
    region:
      static: ap-northeast-2
    stack:
      auto: false
    credentials:
      accessKey: ${AWS_S3_ACCESS_KEY}
      secretKey: ${AWS_S3_SECRET_ACCESS_KEY}