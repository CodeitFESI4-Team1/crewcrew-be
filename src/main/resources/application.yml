spring:
  web:
    resources:
      add-mappings: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

# jwt
jwt:
  secret:
    key: ${jwt.secret.key}
  access:
    expire: ${JWT.ACCESS.EXPIRE}
  refresh:
    expire: ${JWT.REFRESH.EXPIRE}